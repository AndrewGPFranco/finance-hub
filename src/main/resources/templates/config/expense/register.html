<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Configurar despesa')}"></head>
<body>
<div class="app-shell">
    <header th:replace="~{fragments/header :: appHeader('expense')}"></header>

    <main class="app-main">
        <section class="dashboard-header">
            <div>
                <h1 class="page-title">Configurar despesa</h1>
                <p class="page-subtitle">Defina os dados usados para gerar o lançamento da despesa.</p>
            </div>
        </section>

        <section class="content-panel expense-form-panel">
            <form th:action="@{/config/expense/register}" th:object="${config}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{idSubdominio}">

                <div class="form-section">
                    <h2 class="panel-title">Configuração</h2>

                    <div class="form-row">
                        <div class="field-group">
                            <label class="field-label" for="mesDeUso">Mês e ano</label>
                            <input class="field-input" id="mesDeUso" type="month" required
                                   th:field="*{dataDeUso}">
                            <span class="field-error" th:if="${#fields.hasErrors('dataDeUso')}"
                                  th:errors="*{dataDeUso}"></span>
                            <span class="field-help">Período em que a configuração será usada para gerar a despesa.</span>
                        </div>

                        <div class="field-group">
                            <label class="field-label" for="valor">Valor</label>
                            <input class="field-input" id="valor" th:field="*{valor}" type="number"
                                   step="0.01" inputmode="decimal">
                            <span class="field-error" th:if="${#fields.hasErrors('valor')}"
                                  th:errors="*{valor}"></span>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="categoria">Categoria</label>
                        <select class="field-input" id="categoria" th:field="*{categoria}">
                            <option value="">Selecione</option>
                            <option th:each="categoryOption : ${categories}"
                                    th:value="${categoryOption}"
                                    th:text="${categoryOption.name() == 'FOOD' ? 'Alimentação' :
                                        categoryOption.name() == 'HOUSING' ? 'Moradia' :
                                        categoryOption.name() == 'TRANSPORT' ? 'Transporte' :
                                        categoryOption.name() == 'HEALTH' ? 'Saúde' :
                                        categoryOption.name() == 'EDUCATION' ? 'Educação' :
                                        categoryOption.name() == 'ENTERTAINMENT' ? 'Entretenimento' : 'Outros'}">
                            </option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('categoria')}"
                              th:errors="*{categoria}"></span>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="panel-title">Pagamento</h2>

                    <div class="form-row">
                        <div class="field-group">
                            <label class="field-label" for="dataDeVencimento">Vencimento</label>
                            <input class="field-input" id="dataDeVencimento" th:field="*{dataDeVencimento}"
                                   type="date">
                            <span class="field-error" th:if="${#fields.hasErrors('dataDeVencimento')}"
                                  th:errors="*{dataDeVencimento}"></span>
                        </div>

                        <div class="field-group">
                            <label class="field-label" for="dataDoPagamento">Data de pagamento</label>
                            <input class="field-input" id="dataDoPagamento" th:field="*{dataDoPagamento}"
                                   type="date">
                            <span class="field-error" th:if="${#fields.hasErrors('dataDoPagamento')}"
                                  th:errors="*{dataDoPagamento}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field-group">
                            <label class="field-label" for="status">Status</label>
                            <select class="field-input" id="status" th:field="*{status}">
                                <option value="">Selecione</option>
                                <option th:each="statusOption : ${status}"
                                        th:value="${statusOption}"
                                        th:text="${statusOption.name() == 'PAID' ? 'Pago' :
                                            statusOption.name() == 'PENDING' ? 'Pendente' :
                                            statusOption.name() == 'OVERDUE' ? 'Atrasado' : 'Cancelado'}">
                                </option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('status')}"
                                  th:errors="*{status}"></span>
                        </div>

                        <div class="field-group">
                            <label class="field-label" for="metodoDoPagamento">Forma de pagamento</label>
                            <select class="field-input" id="metodoDoPagamento" th:field="*{metodoDoPagamento}">
                                <option value="">Selecione</option>
                                <option th:each="paymentMethodOption : ${paymentMethods}"
                                        th:value="${paymentMethodOption}"
                                        th:text="${paymentMethodOption.name() == 'PIX' ? 'PIX' :
                                            paymentMethodOption.name() == 'DEBIT_CARD' ? 'Cartão de débito' :
                                            paymentMethodOption.name() == 'CREDIT_CARD' ? 'Cartão de crédito' :
                                            paymentMethodOption.name() == 'TRANSFER' ? 'Transferência' : 'Outro'}">
                                </option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('metodoDoPagamento')}"
                                  th:errors="*{metodoDoPagamento}"></span>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-secondary"
                       th:href="@{/expense/by-user(subdomainId=${selectedSubdomainId}, dataDeUso=${selectedDate})}">Cancelar</a>
                    <button class="btn btn-primary btn-primary-inline" type="submit">Salvar configuração</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
